{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0, 
                   maximum-scale=1.0, 
                   user-scalable=no,
                   minimal-ui">
    <title>Flip Card Spelling Game</title>
    
    <!-- PWA meta tags and icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Game">
    <!-- DESIGN "Type": Andika Bold (letter blocks), Courier Prime Bold
         (split-flap logo and counter) -->
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/game.css' %}?v=27">
</head>
<body>
    <!-- Header: the split-flap "flip" logo top-left and the mute toggle
         top-right, inside the frame on every screen (DESIGN "Layout"). No
         other text: the English auth line is gone (DESIGN "Words on
         screen", B-116). The mute toggle (BACKLOG B-108, B-108b) is one
         button holding v5's small cream speaker glyph (code: a wave, or
         a cross while muted) followed by the brass switch (images: knob
         right for sound on, knob left for muted, stacked; CSS shows one,
         as the lever and dome do). main.js sets class is-muted and
         aria-pressed from state.muted. The aria-label is for screen
         readers only, never shown.
         The back button (BACKLOG B-201) shows on the play screen only
         (CSS keyed on body[data-screen]): the sticker book's line arrow
         as a cream glyph with no face, left of the mute toggle; main.js
         drops the round and goes to the theme screen. -->
    <header class="app-header">
        <span class="app-title" role="img" aria-label="flip"><span class="flap">f</span><span class="flap">l</span><span class="flap">i</span><span class="flap">p</span></span>
        <button id="play-back-btn" class="play-back-btn" type="button" aria-label="Back">
            <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M19.5 12H5.5M11 5.5L4.5 12l6.5 6.5"/></svg>
        </button>
        <button id="mute-btn" class="mute-btn" type="button" aria-label="Mute" aria-pressed="false">
            <svg class="icon-sound" viewBox="2.4 4.2 19.8 15.6" aria-hidden="true"><path class="body" d="M3 9.2h3.6L12 4.8v14.4l-5.4-4.4H3z"/><path class="line" d="M15.6 8.4a5.2 5.2 0 0 1 0 7.2"/></svg>
            <svg class="icon-muted" viewBox="2.4 4.2 19.8 15.6" aria-hidden="true"><path class="body" d="M3 9.2h3.6L12 4.8v14.4l-5.4-4.4H3z"/><path class="line" d="M15.8 9.4l5.2 5.2M21 9.4l-5.2 5.2"/></svg>
            <span class="switch" aria-hidden="true">
                <img class="switch-on" src="{% static 'images/ui/mute-switch-on.png' %}" alt="" />
                <img class="switch-off" src="{% static 'images/ui/mute-switch-off.png' %}" alt="" />
            </span>
        </button>
    </header>

    <!-- Theme, round-end and sticker book are the interim screens (DESIGN
         "Other screens (interim)", BACKLOG B-116): the blurred, darkened
         lab behind them (body::before), the same frame, cream panels with
         a brass border, and icons instead of English labels (play,
         themes, stickers, back as inline SVG). aria-labels are for screen
         readers only, never shown. -->

    <!-- Theme screen: one card per theme showing the theme's picture
         (main.js), the level picker and the sticker book button (star
         sticker). The level picker (BACKLOG B-202) is three panel buttons
         with 1, 2 and 3 bulbs (the lives bulbs' look); main.js sets
         aria-pressed on the picked one, which CSS draws pressed in with
         its bulbs lit (the others raised, bulbs dark). -->
    <div id="screen-theme" class="screen">
        <div id="theme-buttons"></div>
        <div id="level-picker" class="levels" role="group" aria-label="level">
            <button id="level-easy" class="panel-btn level-btn" type="button" aria-label="easy" aria-pressed="true">
                <span class="bulb"></span>
            </button>
            <button id="level-normal" class="panel-btn level-btn" type="button" aria-label="normal" aria-pressed="false">
                <span class="bulb"></span><span class="bulb"></span>
            </button>
            <button id="level-hard" class="panel-btn level-btn" type="button" aria-label="hard" aria-pressed="false">
                <span class="bulb"></span><span class="bulb"></span><span class="bulb"></span>
            </button>
        </div>
        <div class="actions">
            <button id="stickers-btn" class="panel-btn" type="button" aria-label="Stickers">
                <span class="sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
            </button>
        </div>
    </div>

    <!-- Play screen: the lab scene (DESIGN.md "Layout", v5). The TV
         picture (.card) and the brass plate (lives bulbs, split-flap
         counter) are placed over the background image; the slot rail
         (#letter-boxes) and the bench of letter blocks (#letter-tray)
         follow below the machine, and the console sits at the bottom of
         the safe area. Ids are keyed on by card.js, controls.js and
         main.js; do not rename. No text anywhere on this screen (DESIGN
         "Words on screen"): feedback is light and motion (feedback.js,
         celebrate.js). .tv-tune is the canvas tv.js draws a new word's
         tune-in on (snow, sync bar, the picture rolling in) and .tv-roll
         the faint bar that rolls past after it (BACKLOG B-214); .tv-static
         and .tv-flash are the TV's wrong-check static and correct-check
         flash. All four are invisible at rest and take no taps. -->
    <div id="screen-play" class="screen" style="display: none;">
        <div class="card">
            <img id="play-image" src="" alt="" />
            <canvas class="tv-tune" aria-hidden="true"></canvas>
            <div class="tv-roll" aria-hidden="true"></div>
            <div class="tv-static" aria-hidden="true"></div>
            <div class="tv-flash" aria-hidden="true"></div>
        </div>
        <div class="plate">
            <div class="hearts" aria-label="Lives">
                <span></span><span></span><span></span>
            </div>
            <p id="word-counter" class="word-counter"></p>
        </div>
        <div id="letter-boxes" class="letter-boxes"></div>
        <div id="letter-tray" class="letter-tray"></div>
        <!-- Console (DESIGN "Controls and states", BACKLOG B-114): on its
             brass plate, left to right, the reset lever, the speaker and
             the check dome (also "next"). Each control stacks its image
             assets; controls.js shows one of them from state (class
             is-<state> on the button). aria-labels are for screen readers
             only, never shown.
             The robot (CHARACTER.md, BACKLOG B-115, B-210) stands behind
             the console's left third, a puppet of parts on one 505x505
             canvas (static/images/ui/robot/): .robot holds his body and
             head (with the eyebrows and the visor's code-drawn eyes, scope
             mouth and cap sparks in SVG) and is drawn under the console,
             the rail and the bench blocks; .robot-hands holds his two
             mittens (every shape stacked, one shown) in a layer over the
             console's top edge, still under the controls and the blocks
             (game.css). character.js moves the parts. -->
        <div class="console">
            <div class="robot eyes-idle brows-calm hands-rest" data-head="0" aria-hidden="true">
                <div class="puppet">
                    <div class="pup-in">
                        <div class="pup-float">
                            <div class="part robot-torso"><img src="{% static 'images/ui/robot/body.png' %}" alt="" /></div>
                            <div class="part robot-head">
                                <img src="{% static 'images/ui/robot/head.png' %}" alt="" />
                                <svg class="visor" viewBox="0 0 1264 1264" aria-hidden="true">
                                    <defs>
                                        <filter id="robot-glow" x="-60%" y="-60%" width="220%" height="220%">
                                            <feGaussianBlur stdDeviation="9" result="b" />
                                            <feMerge><feMergeNode in="b" /><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
                                        </filter>
                                        <clipPath id="robot-visor"><ellipse cx="666" cy="464" rx="194" ry="116" transform="rotate(10 666 464)" /></clipPath>
                                        <radialGradient id="robot-cap-glow"><stop class="cap-hi" offset="0" /><stop class="cap-mid" offset=".5" /><stop class="cap-lo" offset="1" /></radialGradient>
                                    </defs>
                                    <g class="cap" opacity="0">
                                        <ellipse cx="722" cy="186" rx="110" ry="60" fill="url(#robot-cap-glow)" />
                                        <g class="sparks" filter="url(#robot-glow)">
                                            <path d="M700 170 l-14 -40 l16 -6 l-12 -36" />
                                            <path d="M735 168 l10 -44 l-16 -4 l12 -34" />
                                            <path d="M760 178 l30 -28 l-12 -10 l26 -24" />
                                        </g>
                                    </g>
                                    <g class="cap-flash">
                                        <ellipse cx="722" cy="186" rx="110" ry="60" fill="url(#robot-cap-glow)" />
                                        <g class="sparks" filter="url(#robot-glow)">
                                            <path d="M700 170 l-14 -40 l16 -6 l-12 -36" />
                                            <path d="M735 168 l10 -44 l-16 -4 l12 -34" />
                                            <path d="M760 178 l30 -28 l-12 -10 l26 -24" />
                                        </g>
                                    </g>
                                    <g clip-path="url(#robot-visor)">
                                        <g filter="url(#robot-glow)">
                                            <g class="visor-eyes">
                                                <g class="visor-eye visor-eye-L" transform="translate(590 452)">
                                                    <ellipse class="ball" rx="34" ry="48" />
                                                    <path class="arc" d="M-30 10 Q0 -28 30 10" opacity="0" />
                                                </g>
                                                <g class="visor-eye visor-eye-R" transform="translate(748 480)">
                                                    <ellipse class="ball" rx="30" ry="42" />
                                                    <path class="arc" d="M-26 10 Q0 -24 26 10" opacity="0" />
                                                </g>
                                            </g>
                                            <g transform="rotate(10 666 464)">
                                                <path class="scope" d="M556 548 L776 548" opacity=".28" />
                                            </g>
                                        </g>
                                    </g>
                                </svg>
                                <div class="part brow brow-L"><div class="part brow-float"><img src="{% static 'images/ui/robot/browL.png' %}" alt="" /></div></div>
                                <div class="part brow brow-R"><div class="part brow-float"><img src="{% static 'images/ui/robot/browR.png' %}" alt="" /></div></div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <img class="console-body" src="{% static 'images/ui/console.png' %}" alt="" />
            <div class="robot-hands" aria-hidden="true">
                <div class="part hands-in">
                    <div class="part hands-float">
                        <div class="part hand hand-L">
                            <div class="part hand-drift">
                                <div class="part hand-flip">
                                    <img class="shape-rest on" data-shape="rest" src="{% static 'images/ui/robot/hand-restL.png' %}" alt="" />
                                    <img class="shape-wave mirror" data-shape="wave" src="{% static 'images/ui/robot/hand-wave.png' %}" alt="" />
                                    <img class="shape-point mirror" data-shape="point" src="{% static 'images/ui/robot/hand-point.png' %}" alt="" />
                                    <img class="shape-ball mirror" data-shape="ball" src="{% static 'images/ui/robot/hand-ball.png' %}" alt="" />
                                    <img class="shape-palm mirror" data-shape="palm" src="{% static 'images/ui/robot/hand-palm.png' %}" alt="" />
                                </div>
                            </div>
                        </div>
                        <div class="part hand hand-R">
                            <div class="part hand-drift">
                                <div class="part hand-flip">
                                    <img class="shape-rest on" data-shape="rest" src="{% static 'images/ui/robot/hand-restR.png' %}" alt="" />
                                    <img class="shape-wave" data-shape="wave" src="{% static 'images/ui/robot/hand-wave.png' %}" alt="" />
                                    <img class="shape-point" data-shape="point" src="{% static 'images/ui/robot/hand-point.png' %}" alt="" />
                                    <img class="shape-ball" data-shape="ball" src="{% static 'images/ui/robot/hand-ball.png' %}" alt="" />
                                    <img class="shape-palm" data-shape="palm" src="{% static 'images/ui/robot/hand-palm.png' %}" alt="" />
                                </div>
                            </div>
                        </div>
                    </div>
                </div>
            </div>
            <button id="reset-btn" class="ctl" type="button" aria-label="Reset">
                <span class="sprite">
                    <img class="lever-up" src="{% static 'images/ui/lever-up.png' %}" alt="" />
                    <img class="lever-down" src="{% static 'images/ui/lever-down.png' %}" alt="" />
                </span>
            </button>
            <button id="speak-btn" class="ctl" type="button" aria-label="Hear the word">
                <span class="sprite">
                    <img class="speaker-off" src="{% static 'images/ui/speaker-off.png' %}" alt="" />
                    <img class="speaker-on" src="{% static 'images/ui/speaker-on.png' %}" alt="" />
                    <img class="speaker-cap" src="{% static 'images/ui/speaker-cap.png' %}" alt="" />
                </span>
            </button>
            <button id="check-btn" class="ctl" type="button" aria-label="Check" disabled>
                <span class="sprite">
                    <img class="dome-off" src="{% static 'images/ui/dome-off.png' %}" alt="" />
                    <img class="dome-ready" src="{% static 'images/ui/dome-ready.png' %}" alt="" />
                    <img class="dome-pressed" src="{% static 'images/ui/dome-pressed.png' %}" alt="" />
                </span>
            </button>
        </div>
    </div>

    <!-- Round-end screen: the stars, then a cream panel with the score
         (split-flap), the new-sticker count (a sticker and "+N") and the
         five words, each with its picture, a sticker if it is new in the
         book and a lit or dark bulb; then themes and play again (BACKLOG
         B-107, B-111, B-116). main.js fills the stars (class "earned"),
         #round-score, #round-new and #round-words. Each star is a dark
         star plus a lit "fill" layer that celebrate.js pops in.
         #level-up-btn is the level-up nudge (BACKLOG B-209): hidden
         until two rounds in a row earn 3 stars on one level (not on
         hard); main.js then fills it with the next level's bulbs, lit,
         and game.css pulses a glow around it. A tap starts a round of
         the same theme at that level. -->
    <div id="screen-round-end" class="screen" style="display: none;">
        <div id="round-stars" class="stars" aria-label="Stars">
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
        </div>
        <div class="panel round-panel">
            <div class="round-totals">
                <h2 id="round-score" class="flaps"></h2>
                <p id="round-new" class="round-new"></p>
            </div>
            <ul id="round-words" class="round-words"></ul>
        </div>
        <div class="actions">
            <button id="themes-btn" class="panel-btn" type="button" aria-label="Themes">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/></svg>
            </button>
            <button id="play-again-btn" class="panel-btn" type="button" aria-label="Play again">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.3-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8z"/></svg>
            </button>
            <button id="level-up-btn" class="panel-btn level-btn level-up" type="button" aria-label="next level" hidden></button>
        </div>
    </div>

    <!-- Gallery screen: the sticker book (BACKLOG B-112, B-116). Back on
         the left, a star sticker as the heading. gallery.js fills
         #gallery-themes with one cream panel per theme (the theme's
         picture and the split-flap count "3/14", then a 3-column grid of
         the theme's words) and shows #gallery-empty, a dark sticker, when
         the book has no sticker at all. -->
    <div id="screen-gallery" class="screen" style="display: none;">
        <div class="gallery-top">
            <button id="gallery-back-btn" class="panel-btn" type="button" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M19.5 12H5.5M11 5.5L4.5 12l6.5 6.5"/></svg>
            </button>
            <h2 aria-label="Stickers"><span class="sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span></h2>
        </div>
        <div id="gallery-empty" class="gallery-empty" role="img" aria-label="No stickers yet" style="display: none;">
            <span class="sticker off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
        </div>
        <div id="gallery-themes" class="gallery-themes"></div>
    </div>

    <!-- Bakelite frame over every screen (DESIGN.md "Layout", "Other
         screens (interim)"): border-image only, click-through, above
         everything. -->
    <div class="frame" aria-hidden="true"></div>

<!-- GSAP + Draggable (drag.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/Draggable.min.js"></script>

<!-- Game script -->
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
