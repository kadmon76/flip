{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0, 
                   maximum-scale=1.0, 
                   user-scalable=no,
                   minimal-ui">
    <title>Flip Card Spelling Game</title>
    
    <!-- PWA meta tags and icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Game">
    <!-- DESIGN "Type": Andika Bold (letter blocks), Courier Prime Bold
         (split-flap logo and counter) -->
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/game.css' %}?v=12">
</head>
<body>
    <!-- Header: the split-flap "flip" logo, top-left inside the frame's
         safe area on every screen (DESIGN "Layout"). No other text: the
         English auth line is gone (DESIGN "Words on screen", B-116). -->
    <header class="app-header">
        <span class="app-title" role="img" aria-label="flip"><span class="flap">f</span><span class="flap">l</span><span class="flap">i</span><span class="flap">p</span></span>
    </header>

    <!-- Theme, round-end and sticker book are the interim screens (DESIGN
         "Other screens (interim)", BACKLOG B-116): the blurred, darkened
         lab behind them (body::before), the same frame, cream panels with
         a brass border, and icons instead of English labels (play,
         themes, stickers, back as inline SVG). aria-labels are for screen
         readers only, never shown. -->

    <!-- Theme screen: one card per theme showing the theme's picture
         (main.js), and the sticker book button (star sticker). -->
    <div id="screen-theme" class="screen">
        <div id="theme-buttons"></div>
        <div class="actions">
            <button id="stickers-btn" class="panel-btn" type="button" aria-label="Stickers">
                <span class="sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
            </button>
        </div>
    </div>

    <!-- Play screen: the lab scene (DESIGN.md "Layout", v5). The TV
         picture (.card) and the brass plate (lives bulbs, split-flap
         counter) are placed over the background image; the slot rail
         (#letter-boxes) and the bench of letter blocks (#letter-tray)
         follow below the machine, and the console sits at the bottom of
         the safe area. Ids are keyed on by card.js, controls.js and
         main.js; do not rename. No text anywhere on this screen (DESIGN
         "Words on screen"): feedback is light and motion (feedback.js,
         celebrate.js). .tv-static and .tv-flash are the TV's wrong-check
         static and correct-check flash, invisible at rest. -->
    <div id="screen-play" class="screen" style="display: none;">
        <div class="card">
            <img id="play-image" src="" alt="" />
            <div class="tv-static" aria-hidden="true"></div>
            <div class="tv-flash" aria-hidden="true"></div>
        </div>
        <div class="plate">
            <div class="hearts" aria-label="Lives">
                <span></span><span></span><span></span>
            </div>
            <p id="word-counter" class="word-counter"></p>
        </div>
        <div id="letter-boxes" class="letter-boxes"></div>
        <div id="letter-tray" class="letter-tray"></div>
        <!-- Console (DESIGN "Controls and states", BACKLOG B-114): on its
             brass plate, left to right, the reset lever, the speaker and
             the check dome (also "next"). Each control stacks its image
             assets; controls.js shows one of them from state (class
             is-<state> on the button). aria-labels are for screen readers
             only, never shown. -->
        <div class="console">
            <img class="console-body" src="{% static 'images/ui/console.png' %}" alt="" />
            <button id="reset-btn" class="ctl" type="button" aria-label="Reset">
                <span class="sprite">
                    <img class="lever-up" src="{% static 'images/ui/lever-up.png' %}" alt="" />
                    <img class="lever-down" src="{% static 'images/ui/lever-down.png' %}" alt="" />
                </span>
            </button>
            <button id="speak-btn" class="ctl" type="button" aria-label="Hear the word">
                <span class="sprite">
                    <img class="speaker-off" src="{% static 'images/ui/speaker-off.png' %}" alt="" />
                    <img class="speaker-on" src="{% static 'images/ui/speaker-on.png' %}" alt="" />
                    <img class="speaker-cap" src="{% static 'images/ui/speaker-cap.png' %}" alt="" />
                </span>
            </button>
            <button id="check-btn" class="ctl" type="button" aria-label="Check" disabled>
                <span class="sprite">
                    <img class="dome-off" src="{% static 'images/ui/dome-off.png' %}" alt="" />
                    <img class="dome-ready" src="{% static 'images/ui/dome-ready.png' %}" alt="" />
                    <img class="dome-pressed" src="{% static 'images/ui/dome-pressed.png' %}" alt="" />
                </span>
            </button>
        </div>
    </div>

    <!-- Round-end screen: the stars, then a cream panel with the score
         (split-flap), the new-sticker count (a sticker and "+N") and the
         five words, each with its picture, a sticker if it is new in the
         book and a lit or dark bulb; then themes and play again (BACKLOG
         B-107, B-111, B-116). main.js fills the stars (class "earned"),
         #round-score, #round-new and #round-words. Each star is a dark
         star plus a lit "fill" layer that celebrate.js pops in. -->
    <div id="screen-round-end" class="screen" style="display: none;">
        <div id="round-stars" class="stars" aria-label="Stars">
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
        </div>
        <div class="panel round-panel">
            <div class="round-totals">
                <h2 id="round-score" class="flaps"></h2>
                <p id="round-new" class="round-new"></p>
            </div>
            <ul id="round-words" class="round-words"></ul>
        </div>
        <div class="actions">
            <button id="themes-btn" class="panel-btn" type="button" aria-label="Themes">
                <svg viewBox="0 0 24 24" aria-hidden="true"><rect x="3.5" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="3.5" width="7.5" height="7.5" rx="1.5"/><rect x="3.5" y="13" width="7.5" height="7.5" rx="1.5"/><rect x="13" y="13" width="7.5" height="7.5" rx="1.5"/></svg>
            </button>
            <button id="play-again-btn" class="panel-btn" type="button" aria-label="Play again">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M8 4.8v14.4a1 1 0 0 0 1.5.86l11.3-7.2a1 1 0 0 0 0-1.72L9.5 3.94A1 1 0 0 0 8 4.8z"/></svg>
            </button>
        </div>
    </div>

    <!-- Gallery screen: the sticker book (BACKLOG B-112, B-116). Back on
         the left, a star sticker as the heading. gallery.js fills
         #gallery-themes with one cream panel per theme (the theme's
         picture and the split-flap count "3/14", then a 3-column grid of
         the theme's words) and shows #gallery-empty, a dark sticker, when
         the book has no sticker at all. -->
    <div id="screen-gallery" class="screen" style="display: none;">
        <div class="gallery-top">
            <button id="gallery-back-btn" class="panel-btn" type="button" aria-label="Back">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path class="stroke" d="M19.5 12H5.5M11 5.5L4.5 12l6.5 6.5"/></svg>
            </button>
            <h2 aria-label="Stickers"><span class="sticker"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span></h2>
        </div>
        <div id="gallery-empty" class="gallery-empty" role="img" aria-label="No stickers yet" style="display: none;">
            <span class="sticker off"><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
        </div>
        <div id="gallery-themes" class="gallery-themes"></div>
    </div>

    <!-- Bakelite frame over every screen (DESIGN.md "Layout", "Other
         screens (interim)"): border-image only, click-through, above
         everything. -->
    <div class="frame" aria-hidden="true"></div>

<!-- GSAP + Draggable (drag.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/Draggable.min.js"></script>

<!-- Game script -->
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
