{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0, 
                   maximum-scale=1.0, 
                   user-scalable=no,
                   minimal-ui">
    <title>Flip Card Spelling Game</title>
    
    <!-- PWA meta tags and icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Game">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/game.css' %}?v=3">
</head>
<body>
    <!-- Header: title + auth in one compact line -->
    <header class="app-header">
        <span class="app-title">Flip</span>
        {% if user.is_authenticated %}
        <span class="auth">
            <span class="user-info">Hi, {{ user.username }}!</span>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </span>
        {% endif %}
    </header>

    <!-- Theme screen -->
    <div id="screen-theme" class="screen">
        <h2>Select a Theme</h2>
        <div id="theme-buttons"></div>
    </div>

    <!-- Play screen -->
    <div id="screen-play" class="screen" style="display: none;">
        <div class="card">
            <img id="play-image" src="" alt="" />
            <div class="hearts" aria-label="Lives">
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
                <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
            </div>
        </div>
        <div id="letter-boxes" class="letter-boxes"></div>
        <div id="letter-tray" class="letter-tray"></div>
        <p id="result-line" class="result-line"></p>
        <div class="actions">
            <button id="check-btn" class="action-btn" disabled>Check</button>
            <button id="next-btn" class="action-btn">Next</button>
        </div>
    </div>

    <!-- Round-end screen -->
    <div id="screen-round-end" class="screen" style="display: none;">
        <h2 id="round-score"></h2>
        <div class="actions">
            <button id="play-again-btn" class="action-btn">Play again</button>
        </div>
    </div>

    <!-- Gallery screen (placeholder) -->
    <div id="screen-gallery" class="screen" style="display: none;"></div>

<!-- GSAP + Draggable (drag.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/Draggable.min.js"></script>

<!-- Game script -->
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
