{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0, 
                   maximum-scale=1.0, 
                   user-scalable=no,
                   minimal-ui">
    <title>Flip Card Spelling Game</title>
    
    <!-- PWA meta tags and icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Game">
    <!-- DESIGN "Type": Andika Bold (letter blocks), Courier Prime Bold
         (split-flap logo and counter) -->
    <link href="https://fonts.googleapis.com/css2?family=Andika:wght@700&family=Courier+Prime:wght@700&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/game.css' %}?v=10">
</head>
<body>
    <!-- Header: split-flap "flip" logo + auth in one compact line. On the
         play screen it sits over the lab shelf and the auth is hidden
         (no English on that screen). -->
    <header class="app-header">
        <span class="app-title" role="img" aria-label="flip"><span class="flap">f</span><span class="flap">l</span><span class="flap">i</span><span class="flap">p</span></span>
        {% if user.is_authenticated %}
        <span class="auth">
            <span class="user-info">Hi, {{ user.username }}!</span>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </span>
        {% endif %}
    </header>

    <!-- Theme screen -->
    <div id="screen-theme" class="screen">
        <h2>Select a Theme</h2>
        <div id="theme-buttons"></div>
        <!-- opens the sticker book (BACKLOG B-112); same look as the
             action buttons, 56px tall -->
        <div class="actions">
            <button id="stickers-btn" class="action-btn">Stickers</button>
        </div>
    </div>

    <!-- Play screen: the lab scene (DESIGN.md "Layout", v5). The TV
         picture (.card) and the brass plate (lives bulbs, split-flap
         counter) are placed over the background image; the slot rail
         (#letter-boxes) and the bench of letter blocks (#letter-tray)
         follow below the machine. Ids are keyed on by card.js and main.js;
         do not rename. #result-line stays for main.js but is never shown
         (no result text, DESIGN "Words on screen"). Check / Next are
         interim icon buttons until the console (BACKLOG B-114). -->
    <div id="screen-play" class="screen" style="display: none;">
        <div class="card">
            <img id="play-image" src="" alt="" />
        </div>
        <div class="plate">
            <div class="hearts" aria-label="Lives">
                <span></span><span></span><span></span>
            </div>
            <p id="word-counter" class="word-counter"></p>
        </div>
        <div id="letter-boxes" class="letter-boxes"></div>
        <div id="letter-tray" class="letter-tray"></div>
        <p id="result-line" class="result-line" hidden></p>
        <div class="actions">
            <button id="next-btn" class="action-btn icon-btn" aria-label="Next">
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h13M13 6l6 6-6 6"/></svg>
            </button>
            <button id="check-btn" class="action-btn icon-btn" aria-label="Check" disabled>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12.5l4.5 4.5L19 7"/></svg>
            </button>
        </div>
    </div>

    <!-- Round-end screen: stars, score, the five words with a tick or
         cross, Play again / Themes (BACKLOG B-107). main.js fills the
         stars (class "earned"), #round-score, #round-new (B-111) and
         #round-words. Each star
         is an outline plus a "fill" layer that celebrate.js pops in. -->
    <div id="screen-round-end" class="screen" style="display: none;">
        <div id="round-stars" class="stars" aria-label="Stars">
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
            <span>
                <svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
                <svg class="fill" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg>
            </span>
        </div>
        <h2 id="round-score"></h2>
        <p id="round-new" class="round-new"></p>
        <ul id="round-words" class="round-words"></ul>
        <div class="actions">
            <button id="play-again-btn" class="action-btn">Play again</button>
            <button id="themes-btn" class="action-btn">Themes</button>
        </div>
    </div>

    <!-- Gallery screen: the sticker book (BACKLOG B-112). gallery.js
         fills #gallery-themes with one section per theme (heading with
         the count, a 3-column grid of the theme's words) and shows
         #gallery-empty when the book has no sticker at all. -->
    <div id="screen-gallery" class="screen" style="display: none;">
        <div class="gallery-top">
            <button id="gallery-back-btn" class="back-btn">Back</button>
            <h2>Stickers</h2>
        </div>
        <p id="gallery-empty" class="gallery-empty" style="display: none;">No stickers yet. Go spell some!</p>
        <div id="gallery-themes" class="gallery-themes"></div>
    </div>

    <!-- Bakelite frame over the play screen (DESIGN.md "Layout"):
         border-image only, click-through, above everything. -->
    <div class="frame" aria-hidden="true"></div>

<!-- GSAP + Draggable (drag.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/Draggable.min.js"></script>

<!-- Game script -->
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
