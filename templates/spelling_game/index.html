{% load static %}
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" 
          content="width=device-width, 
                   initial-scale=1.0, 
                   maximum-scale=1.0, 
                   user-scalable=no,
                   minimal-ui">
    <title>Flip Card Spelling Game</title>
    
    <!-- PWA meta tags and icons -->
    <meta name="apple-mobile-web-app-capable" content="yes">
    <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
    <meta name="apple-mobile-web-app-title" content="Spelling Game">
    <link href="https://fonts.googleapis.com/css2?family=Fredoka+One&display=swap" rel="stylesheet">
    <link rel="apple-touch-icon" href="{% static 'icons/icon-192x192.png' %}">
    <link rel="manifest" href="{% static 'manifest.json' %}">
    <link rel="stylesheet" href="{% static 'css/game.css' %}?v=7">
</head>
<body>
    <!-- Header: title + auth in one compact line -->
    <header class="app-header">
        <span class="app-title">Flip</span>
        {% if user.is_authenticated %}
        <span class="auth">
            <span class="user-info">Hi, {{ user.username }}!</span>
            <a href="{% url 'logout' %}" class="logout-btn">Logout</a>
        </span>
        {% endif %}
        <!-- Mute toggle (BACKLOG B-108): main.js flips state.muted and sets
             class "muted" / aria-pressed. Inline SVG like the hearts so the
             icon takes the palette colour on every phone. -->
        <button id="mute-btn" class="mute-btn" type="button" aria-label="Sound" aria-pressed="false">
            <svg class="icon-sound" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.5L13 5v14l-5.5-4.5H4z"/>
                <path class="wave" d="M16 9.5a3.5 3.5 0 0 1 0 5"/>
                <path class="wave" d="M18.5 7a7 7 0 0 1 0 10"/>
            </svg>
            <svg class="icon-muted" viewBox="0 0 24 24" aria-hidden="true">
                <path d="M4 9.5h3.5L13 5v14l-5.5-4.5H4z"/>
                <path class="wave" d="M16.5 9.5l5 5M21.5 9.5l-5 5"/>
            </svg>
        </button>
    </header>

    <!-- Theme screen -->
    <div id="screen-theme" class="screen">
        <h2>Select a Theme</h2>
        <div id="theme-buttons"></div>
    </div>

    <!-- Play screen: card, hearts, counter, boxes, tray, result, actions
         (top to bottom per BACKLOG B-104). Ids are keyed on by card.js
         and main.js; do not rename. -->
    <div id="screen-play" class="screen" style="display: none;">
        <div class="card">
            <img id="play-image" src="" alt="" />
        </div>
        <div class="hearts" aria-label="Lives">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path fill="currentColor" d="M12 21s-7.5-4.6-9.6-9.1C.8 8.4 2.7 4.5 6.4 4.5c2 0 3.6 1.1 5.6 3.3 2-2.2 3.6-3.3 5.6-3.3 3.7 0 5.6 3.9 4 7.4C19.5 16.4 12 21 12 21z"/></svg></span>
        </div>
        <p id="word-counter" class="word-counter"></p>
        <div id="letter-boxes" class="letter-boxes"></div>
        <div id="letter-tray" class="letter-tray"></div>
        <p id="result-line" class="result-line"></p>
        <div class="actions">
            <button id="check-btn" class="action-btn" disabled>Check</button>
            <button id="next-btn" class="action-btn">Next</button>
        </div>
    </div>

    <!-- Round-end screen: stars, score, the five words with a tick or
         cross, Play again / Themes (BACKLOG B-107). main.js fills the
         stars (class "earned"), #round-score and #round-words. -->
    <div id="screen-round-end" class="screen" style="display: none;">
        <div id="round-stars" class="stars" aria-label="Stars">
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
            <span><svg viewBox="0 0 24 24" aria-hidden="true"><path d="M12 2.5l2.9 6.2 6.8.8-5 4.6 1.3 6.7L12 17.5l-6 3.3 1.3-6.7-5-4.6 6.8-.8z"/></svg></span>
        </div>
        <h2 id="round-score"></h2>
        <ul id="round-words" class="round-words"></ul>
        <div class="actions">
            <button id="play-again-btn" class="action-btn">Play again</button>
            <button id="themes-btn" class="action-btn">Themes</button>
        </div>
    </div>

    <!-- Gallery screen (placeholder) -->
    <div id="screen-gallery" class="screen" style="display: none;"></div>

<!-- GSAP + Draggable (drag.js) -->
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/gsap.min.js"></script>
<script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.11.3/Draggable.min.js"></script>

<!-- Game script -->
<script type="module" src="{% static 'js/main.js' %}"></script>
</body>
</html>
